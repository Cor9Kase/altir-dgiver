<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altifiber Rådgiver - Versjoner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
            color: #302322;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .logo {
            background: #ee4238;
            padding: 15px 25px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 30px;
        }

        .logo img {
            height: 30px;
            display: block;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        .versions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .version-link {
            display: block;
            padding: 20px;
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-decoration: none;
            color: #302322;
            transition: all 0.2s;
        }

        .version-link:hover {
            border-color: #ee4238;
            background: #fff;
        }

        .version-link h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #ee4238;
        }

        .version-link p {
            color: #666;
            font-size: 0.95rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="Altifiber_logo.png" alt="Altifiber Logo">
        </div>

        <h1>Altifiber Rådgiver</h1>
        <p class="subtitle">Velg hvilken versjon du vil se:</p>

        <div class="versions">
            <a href="advisor-classic.html" class="version-link">
                <h2>Klassisk versjon</h2>
                <p>Steg-for-steg rådgiver med tradisjonelt oppsett</p>
            </a>

            <a href="index-speedometer.html" class="version-link">
                <h2>Speedometer versjon</h2>
                <p>Rådgiver med visuell speedometer som viser anbefalt hastighet</p>
            </a>
        </div>
    </div>
</body>

</html>
